# Contributor Licence Agreement, enforced inside this repository (no outside service).
# A contributor signs once by commenting the sentence below on their pull request; signatures are
# committed to the unprotected `cla-signatures` branch. The check "CLA" is required to merge into main.
name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize, reopened]
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
jobs:
  CLA:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record CLA signatures
        if: >-
          github.event_name == 'pull_request_target' ||
          (github.event.issue.pull_request &&
           (github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
        # pinned to v2.6.1; this job never checks out or runs pull-request code
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/mastyf-ai/mastyf-authority/blob/main/CLA.md
          branch: cla-signatures
          allowlist: mastyf-ai,rudraneel93,dependabot[bot],github-actions[bot],bot*
          custom-notsigned-prcomment: >-
            Thank you for contributing to Mastyf Authority! Before we can merge, please sign our
            [Contributor Licence Agreement](https://github.com/mastyf-ai/mastyf-authority/blob/main/CLA.md):
            you keep the copyright in your work. To sign, reply to this pull request with exactly the sentence below.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
          lock-pullrequest-aftermerge: false
