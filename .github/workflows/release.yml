# Tag vX.Y.Z on main to release: Python package + container images (GHCR) + GitHub Release.
name: Release
on:
  push: { tags: ["v*.*.*"] }
permissions: { contents: read }
jobs:
  python:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - name: Software bill of materials for the Python package
        uses: anchore/sbom-action@v0
        with: { path: ., format: spdx-json, output-file: dist/mastyf-authority.spdx.json, upload-artifact: false }
      - name: Build provenance (SLSA) for the wheel and sdist
        uses: actions/attest-build-provenance@v2
        with: { subject-path: "dist/*.whl, dist/*.tar.gz" }
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
  images:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    strategy:
      matrix:
        include:
          - { name: authority, file: deploy/Dockerfile.authority }
          - { name: keyservice, file: deploy/Dockerfile.keyservice }
          - { name: gateway, file: deploy/Dockerfile.gateway }
          - { name: sandbox-py, file: sandbox/Dockerfile.py }
          - { name: sandbox-rs, file: sandbox/Dockerfile.rust }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mastyf-authority-${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/mastyf-authority-${{ matrix.name }}:latest
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless, Sigstore; verify with cosign verify --certificate-identity-regexp)
        env: { DIGEST: "${{ steps.build.outputs.digest }}" }
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/mastyf-authority-${{ matrix.name }}@${DIGEST}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/mastyf-authority-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
  pypi:
    # Trusted publishing (no stored token). One-time setup on pypi.org: add a pending publisher for project
    # "mastyf-authority": owner mastyf-ai, repository mastyf-authority, workflow release.yml, environment pypi.
    needs: [python]
    runs-on: ubuntu-latest
    environment: { name: pypi, url: "https://pypi.org/project/mastyf-authority/" }
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
  release:
    needs: [python, images]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/mastyf-authority && helm package deploy/helm/mastyf-authority -d dist/
      - env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --generate-notes --title "Mastyf Authority ${{ github.ref_name }}"
