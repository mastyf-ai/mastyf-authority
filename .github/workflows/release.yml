# Tag vX.Y.Z on main to release: Python package + container images (GHCR) + GitHub Release.
name: Release
on:
  push: { tags: ["v*.*.*"] }
permissions: { contents: read }
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
  images:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: authority, file: deploy/Dockerfile.authority }
          - { name: keyservice, file: deploy/Dockerfile.keyservice }
          - { name: sandbox-py, file: sandbox/Dockerfile.py }
          - { name: sandbox-rs, file: sandbox/Dockerfile.rust }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mastyf-authority-${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/mastyf-authority-${{ matrix.name }}:latest
  release:
    needs: [python, images]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --generate-notes --title "Mastyf Authority ${{ github.ref_name }}"
