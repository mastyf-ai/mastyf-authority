# Mastyf Authority weekly report: copy this file to .github/workflows/mastyf-authority.yml in a PRIVATE repository
# (for example a new one named mastyf-reports). Every Monday it posts an issue: which GitHub actions in the past week
# should have needed a second person. It runs on GitHub's runners; nothing is sent to Mastyf.
name: Mastyf Authority
on:
  schedule: [{ cron: "0 6 * * 1" }]   # Mondays 06:00 UTC
  workflow_dispatch:                  # or run it now: Actions -> Mastyf Authority -> Run workflow
permissions: { contents: read, issues: write }
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: mastyf-ai/mastyf-authority/action@main
        with:
          # optional: a read-only organisation token makes the report cover every repository (see the report)
          org-token: ${{ secrets.MASTYF_ORG_TOKEN }}
