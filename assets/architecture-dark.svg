<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="372" viewBox="0 0 1280 372" role="img" aria-labelledby="t d">
<title id="t">Where Authority sits</title>
<desc id="d">People, apps and AI agents ask the gateway; the authority decides and signs a grant; the key service releases record keys only within daily limits; data stays encrypted.</desc>
<rect width="1280" height="372" rx="18" fill="#0d0d0e"/>
<text x="24" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="3" fill="#77766f">WHERE IT SITS · IN FRONT OF THE DATA, NOT IN A DASHBOARD</text>
<rect x="24" y="90" width="200" height="160" rx="16" fill="#151517" stroke="#26262a" stroke-width="1.5"/><text x="124.0" y="130" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f2f1ec">Requesters</text><text x="124.0" y="156" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#b9b8b1">people, apps,</text><text x="124.0" y="177" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#b9b8b1">AI agents</text><text x="124.0" y="198" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#b9b8b1">ask before acting</text><path d="M224 170.0 L276 170.0" stroke="#77766f" stroke-width="1.6"/><path d="M272 165.0 l7 5 l-7 5" fill="none" stroke="#77766f" stroke-width="1.6"/><text x="254.0" y="160.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1" fill="#77766f">REQUEST</text><rect x="284" y="90" width="200" height="160" rx="16" fill="#151517" stroke="#26262a" stroke-width="1.5"/><text x="384.0" y="130" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f2f1ec">Gateway</text><text x="384.0" y="156" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#b9b8b1">Rust · TLS 1.3</text><text x="384.0" y="177" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#b9b8b1">API keys, rate limits</text><text x="384.0" y="198" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#b9b8b1">only thing exposed</text><path d="M484 170.0 L536 170.0" stroke="#77766f" stroke-width="1.6"/><path d="M532 165.0 l7 5 l-7 5" fill="none" stroke="#77766f" stroke-width="1.6"/><text x="514.0" y="160.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1" fill="#77766f">DECIDE</text><rect x="544" y="90" width="220" height="160" rx="16" fill="#151517" stroke="#26262a" stroke-width="1.5"/><text x="654.0" y="130" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f2f1ec">Authority</text><text x="654.0" y="156" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#b9b8b1">rules + risk model</text><text x="654.0" y="177" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#b9b8b1">two-person approval</text><text x="654.0" y="198" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#b9b8b1">signed audit log</text><path d="M764 170.0 L816 170.0" stroke="#77766f" stroke-width="1.6"/><path d="M812 165.0 l7 5 l-7 5" fill="none" stroke="#77766f" stroke-width="1.6"/><text x="794.0" y="160.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1" fill="#77766f">GRANT</text><rect x="824" y="90" width="220" height="160" rx="16" fill="rgba(227,180,83,0.10)" stroke="#e3b453" stroke-width="1.5"/><text x="934.0" y="130" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f2f1ec">Key service</text><text x="934.0" y="156" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#b9b8b1">Rust · one key per record</text><text x="934.0" y="177" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#b9b8b1">daily limits, bait</text><text x="934.0" y="198" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#b9b8b1">undo windows</text><path d="M1044 170.0 L1096 170.0" stroke="#77766f" stroke-width="1.6"/><path d="M1092 165.0 l7 5 l-7 5" fill="none" stroke="#77766f" stroke-width="1.6"/><text x="1074.0" y="160.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1" fill="#77766f">KEYS</text><rect x="1104" y="90" width="152" height="160" rx="16" fill="#151517" stroke="#26262a" stroke-width="1.5"/><text x="1180.0" y="130" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f2f1ec">Your data</text><text x="1180.0" y="156" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#b9b8b1">encrypted</text><text x="1180.0" y="177" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#b9b8b1">at rest</text><path d="M284 276 l0 12 L764 288 l0 -12" fill="none" stroke="#c2554a" stroke-opacity="0.7" stroke-width="1.5"/><text x="524.0" y="314" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#c2554a">Assume all of this is hacked …</text><text x="934" y="314" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e3b453">… the ceiling still holds here.</text>
</svg>
