# Default deny inside the release; then only: clients -> gateway, gateway -> engines, engines -> gateway
# (replication through TLS) and engines/apps -> key service. Egress beyond these and DNS is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-engine
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "ma.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: engine } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway } } }]
      ports: [{ port: {{ .Values.engine.port }} }]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway } } }]
      ports: [{ port: {{ .Values.gateway.port }} }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: keyservice } } }]
      ports: [{ port: {{ .Values.keyservice.port }} }]
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-gateway
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "ma.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: engine } } }]
      ports: [{ port: {{ .Values.engine.port }} }]
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-keyservice
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "ma.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: keyservice } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: engine } }
        {{- if .Values.keyserviceClients.namespaceSelector }}
        - namespaceSelector: {{- toYaml .Values.keyserviceClients.namespaceSelector | nindent 12 }}
        {{- end }}
      ports: [{ port: {{ .Values.keyservice.port }} }]
    {{- if .Values.keyservice.ha.enabled }}
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: keyservice } } }]
      ports: [{ port: {{ .Values.keyservice.ha.port }} }]
    {{- end }}
  egress:
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    {{- if .Values.keyservice.ha.enabled }}
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: keyservice } } }]
      ports: [{ port: {{ .Values.keyservice.ha.port }} }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: witness } } }]
      ports: [{ port: {{ .Values.keyservice.ha.witnessPort }} }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-witness
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "ma.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: witness } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: keyservice } } }]
      ports: [{ port: {{ .Values.keyservice.ha.witnessPort }} }]
  egress:
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    {{- end }}
