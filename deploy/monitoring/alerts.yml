# Prometheus alerting rules for Mastyf Authority. Scrape each engine's /metrics (through its gateway or
# on the private network). Severity "page" means a person should look now; "ticket" means today.
groups:
  - name: mastyf-authority
    rules:
      - alert: AuthorityNoActiveEngine
        expr: max(authority_role) < 1
        for: 30s
        labels: { severity: page }
        annotations:
          summary: "No authority engine is active: every decision is refused (fail closed)."
          runbook: "OPERATIONS.md#no-active-engine"
      - alert: AuthorityTwoActiveEngines
        expr: count(authority_role == 1) > 1
        for: 15s
        labels: { severity: page }
        annotations:
          summary: "Two engines report active. Grants from the lower epoch are refused by the key service, but stop the older one."
          runbook: "OPERATIONS.md#fenced-engine"
      - alert: AuthorityEngineFenced
        expr: authority_role == -1
        for: 1m
        labels: { severity: ticket }
        annotations:
          summary: "An engine was replaced during a failover and no longer decides. Rebuild it as a standby."
          runbook: "OPERATIONS.md#fenced-engine"
      - alert: AuthorityStandbyMissing
        expr: authority_role == 1 and on() (absent(authority_replication_last_contact_seconds) or max(authority_replication_last_contact_seconds) > 30)
        for: 2m
        labels: { severity: ticket }
        annotations:
          summary: "The active engine has no standby following it: a crash now means downtime until restart."
      - alert: AuthorityReplicationLag
        expr: max(authority_replication_lag_records) > 5000
        for: 2m
        labels: { severity: ticket }
        annotations:
          summary: "The standby is more than 5,000 records behind; a failover now would lose recent decisions."
      - alert: AuthoritySnapshotStale
        expr: max(authority_snapshot_age_seconds) > 1800
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "No state snapshot for 30 minutes (disk full?). Restarts will replay a long log."
      - alert: AuthorityUnsyncedRecords
        expr: max(authority_audit_unsynced_records) > 10000
        for: 1m
        labels: { severity: ticket }
        annotations:
          summary: "Many decision records not yet fsynced: the disk is too slow for the load."
      - alert: AuthorityModelMissing
        expr: authority_model_loaded == 0 and authority_role == 1
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "The behavioural model is not loaded; sensitive actions escalate to people."
      - alert: AuthorityDenySpike
        expr: sum(rate(authority_decisions_total{verdict="DENY"}[5m])) > 5 * sum(rate(authority_decisions_total{verdict="DENY"}[1h] offset 1d)) + 1
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "Refusals are five times the usual rate: an attack, or a policy change hurting real work."
      - alert: AuthorityFrozenSpike
        expr: max(authority_frozen_identities) - max(authority_frozen_identities offset 15m) > 5
        labels: { severity: page }
        annotations:
          summary: "More than five identities frozen in 15 minutes."
