[package]
name = "mastyf-native"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Hot paths of the Mastyf Authority engine in Rust (Python extension): the risk-model scorer"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
overflow-checks = true
